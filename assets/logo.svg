<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 44" role="img" aria-label="ArabTrail">
  <defs>
    <clipPath id="c">
      <circle cx="22" cy="22" r="20"/>
    </clipPath>
  </defs>
  <!-- 深绿圆底 -->
  <circle cx="22" cy="22" r="20" fill="#094734"/>
  <!-- 金色八角星（阿拉伯几何） -->
  <g clip-path="url(#c)" fill="#c8963a">
    <rect x="9" y="9" width="26" height="26" rx="1"/>
    <rect x="9" y="9" width="26" height="26" rx="1" transform="rotate(45 22 22)"/>
  </g>
  <!-- 中心上升箭头：路径 + 增长 -->
  <path d="M22 27 V16 M16 20.5 L22 15 L28 20.5" fill="none" stroke="#094734" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 双色 wordmark -->
  <text x="48" y="30" font-family="Tajawal, Arial, sans-serif" font-size="22" font-weight="800" fill="#094734">Arab<tspan fill="#c8963a">Trail</tspan></text>
</svg>
